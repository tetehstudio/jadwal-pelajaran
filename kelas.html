</head>

<body>

<div class="content">

<h4 class="mb-3">🏫 Data Kelas</h4>

<div class="card-box mb-3">
<div class="row g-2">

<div class="col-md-8">
<input id="inputKelas" class="form-control" placeholder="Contoh: IX A">
</div>

<div class="col-md-4 d-grid">
<button class="btn btn-success" onclick="tambahKelas()">➕ Tambah</button>
</div>

<div class="col-md-12">
<div id="notif" class="fw-bold"></div>
</div>

</div>
</div>

<div class="card-box mb-3">
<input id="search" class="form-control" placeholder="🔍 Cari kelas..." oninput="render()">
</div>

<div class="card-box">

<table class="table table-bordered table-hover">
<thead class="table-light">
<tr>
<th width="50">No</th>
<th>Nama Kelas</th>
<th width="100">Aksi</th>
</tr>
</thead>

<tbody id="tabelKelas"></tbody>

</table>

</div>

</div>

<script>

// DATA
let kelas = JSON.parse(localStorage.getItem("kelas")) || [];

// NORMALISASI
function norm(v){
  return v.trim().toLowerCase();
}

// 🔥 SORTING KELAS (VII → VIII → IX → A-Z)
function sortKelas(data){

  function getTingkat(k){
    if(k.startsWith("VII")) return 1;
    if(k.startsWith("VIII")) return 2;
    if(k.startsWith("IX")) return 3;
    return 99;
  }

  return data.sort((a,b)=>{
    let tA = getTingkat(a);
    let tB = getTingkat(b);

    if(tA !== tB) return tA - tB;

    return a.localeCompare(b);
  });
}

// TAMBAH
function tambahKelas(){

  let input = document.getElementById("inputKelas");
  let nama = input.value.trim().toUpperCase();

  if(!nama){
    tampilNotif("❗ Isi nama kelas", "danger");
    return;
  }

  if(kelas.some(k => norm(k) === norm(nama))){
    tampilNotif("❌ Kelas sudah ada", "danger");
    return;
  }

  kelas.push(nama);
  kelas = sortKelas(kelas);

  localStorage.setItem("kelas", JSON.stringify(kelas));

  input.value="";
  tampilNotif("✅ Kelas ditambahkan", "success");

  render();
}

// HAPUS
function hapus(index){

  if(!confirm("Hapus kelas ini?")) return;

  kelas.splice(index,1);
  localStorage.setItem("kelas", JSON.stringify(kelas));

  render();
}

// NOTIF
function tampilNotif(pesan, warna){
  let el = document.getElementById("notif");
  el.innerHTML = `<span class="text-${warna}">${pesan}</span>`;
  setTimeout(()=> el.innerHTML="",2000);
}

// RENDER
function render(){

  let keyword = document.getElementById("search").value.toLowerCase();

  let data = sortKelas([...kelas]);

  let html = "";

  data
    .filter(k => k.toLowerCase().includes(keyword))
    .forEach((k,i)=>{

      let indexAsli = kelas.indexOf(k);

      html += `
      <tr>
        <td>${i+1}</td>
        <td>${k}</td>
        <td>
          <button class="btn btn-danger btn-sm" onclick="hapus(${indexAsli})">Hapus</button>
        </td>
      </tr>
      `;
    });

  document.getElementById("tabelKelas").innerHTML = html;
}

// ENTER
document.getElementById("inputKelas").addEventListener("keypress", function(e){
  if(e.key === "Enter") tambahKelas();
});

// INIT
kelas = sortKelas(kelas);
render();

</script>
<script src="js/app.js"></script>
<script src="js/dashboard.js"></script>
</body>
